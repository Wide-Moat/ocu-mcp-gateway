name: ghcr-image

# Publishes the gateway's main-branch container image to GHCR. Until this
# workflow existed the fleet assembly consumed a hand-built local image -
# unpullable, unreproducible, unsigned; this is the publish pipeline that
# replaces it.
#
# ORDER IS THE POINT: build pushes BY DIGEST ONLY, sign-image signs that exact
# digest, and only then does promote attach the branch/sha tags. Between the
# push and the signature the image exists solely under a sha256 reference
# nobody has been told, so there is no window in which a consumer-reachable tag
# resolves to an unsigned image. Signing after tagging would leave exactly that
# window -- and it is the failure the `signing-precedes-publish` gate in
# security.yml exists to red. release.yml already ships this shape; this file
# now matches it rather than contradicting it.
#
# NO `v*` TAG TRIGGER. release.yml owns tagged releases end-to-end (CalVer
# tag-format check, security gates, verify, image-scan, SBOM, sign, promote,
# GitHub Release). Firing both on `v*` would race two publishes at the same
# ghcr.io/${{ github.repository }} ref, and the loser's tag would silently win
# or lose depending on ordering. This workflow covers main only: the rolling
# image the fleet assembly tracks between releases.
#
# There is no PR leg: the per-PR image build already runs in security.yml (the
# trivy image scan builds the same Dockerfile), so a PR leg here would duplicate
# it without adding a gate.
#
# The image carries no semver build-arg: the daemon's revision is the negotiated
# MCP date string (NFR-IC-04), so - unlike control - there is no main.version
# symbol to stamp (see the Dockerfile header).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ghcr-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages:write only here, only for the registry push.
      packages: write
    outputs:
      # The pushed image digest (sha256:...), consumed by sign-image and then
      # by promote. It is the ONLY handle on the image until promote runs.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the OCI labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # metadata-action lowercases the repository name for the OCI ref.
          # Labels only here; the tags are derived again in promote, after the
          # signature exists.
          images: ghcr.io/${{ github.repository }}
      - name: build and push linux/amd64 + linux/arm64 (digest only)
        id: push
        # The Dockerfile cross-compiles in the builder stage (Go, no QEMU tax)
        # and ships distroless-static; both platforms publish under one index.
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # Disable BuildKit's built-in attestations: the explicit syft + cosign
          # steps below are the fleet-consistent source, and default-provenance
          # would turn the push into a differently-shaped OCI index, changing the
          # digest that gets signed. NO VERSION build-arg (NFR-IC-04).
          # No `tags:`: only the digest reference exists until promote runs.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: false
          provenance: false

  sign-image:
    # Signing is needs:-gated on the push: what gets signed is exactly the
    # digest THIS run pushed, on every trigger that pushes. The job is
    # separate from the build so the OIDC token never coexists with the
    # build steps in one job environment.
    needs: ghcr-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages:write lets cosign push the signature and the SBOM
      # attestation next to the image; id-token:write mints the OIDC token
      # keyless signing exchanges for a short-lived Fulcio certificate - no
      # long-lived signing key exists.
      packages: write
      id-token: write
    steps:
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign keyless sign + SPDX attest - by digest
        env:
          DIGEST: ${{ needs.ghcr-image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail loudly if the push exported no digest: an unsigned image on
          # the registry must always mean a red run.
          [ -n "$DIGEST" ] || { echo "the ghcr-image job exported no digest - refusing to leave a pushed image unsigned" >&2; exit 1; }
          # OCI references must be lowercase; github.repository preserves the
          # org's original case.
          ref="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')@${DIGEST}"
          cosign sign --yes "$ref"
          syft "$ref" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"

  promote:
    # The consumer-reachable tags are attached HERE, gated on sign-image, so a
    # tag never resolves to an unsigned digest. Every tag points at the one
    # multi-arch index digest sign-image just signed, so a caller pulling by
    # `main` or by the commit sha gets the identical, already-signed image.
    needs: [ghcr-image, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the image tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The branch name (the rolling `main` image the fleet tracks) and the
          # immutable commit sha. No `v*` pattern: tagged releases are
          # release.yml's, not this workflow's.
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - name: tag the signed digest
        env:
          DIGEST: ${{ needs.ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no digest to promote - refusing to tag" >&2; exit 1; }
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          # One imagetools create per tag, all pointing at the same signed
          # multi-arch index digest.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "tagging ${tag} -> ${name}@${DIGEST}"
            docker buildx imagetools create --tag "$tag" "${name}@${DIGEST}"
          done <<< "${{ steps.meta.outputs.tags }}"

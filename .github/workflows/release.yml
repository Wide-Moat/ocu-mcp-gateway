#
# Tag-triggered container release for the ocu-mcp-gatewayd daemon (component-01).
# The gateway carries no semver by design (its compatibility contract is the
# negotiated MCP date string, NFR-IC-04), so releases are named with CalVer
# date tags -- v2026.07.20, optional .N for a same-day re-release -- NOT semver.
# The tag names the RELEASE EVENT and the container BUILD DATE; it is never the
# MCP protocol revision and is never stamped into the binary (no VERSION
# build-arg, no -X main.version -- see the Dockerfile header). The artifact of
# record is the OCI image by DIGEST; cosign signatures and SLSA provenance bind
# to that digest, not to a mutable tag. This mirrors the ocu-control /
# ocu-filestore container-release posture (explicit syft + cosign + attest
# steps) so the fleet has one verification runbook, MINUS their semver stamping.

name: release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default. Jobs that push packages, sign, or attest elevate
# only what they need.
permissions:
  contents: read

jobs:
  # tag-format gates the whole pipeline: only well-formed CalVer date tags
  # proceed. The v* glob is permissive; a semver or arbitrary tag must fail
  # loud here -- the gateway deliberately has no semver, so a v1.2.3 tag is a
  # category error, not a release.
  tag-format:
    runs-on: ubuntu-latest
    steps:
      - name: validate the CalVer date tag
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          # CalVer: YYYY.0M.0D with an optional .N same-day counter.
          # e.g. 2026.07.20 or 2026.07.20.2. NOT semver (that scheme would
          # imply a compatibility promise the gateway does not make; its
          # contract is the negotiated MCP date string, NFR-IC-04).
          if ! echo "$v" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not a CalVer date tag (vYYYY.MM.DD[.N]). The gateway carries no semver by design (NFR-IC-04); releases are named by build date."
            exit 1
          fi
          echo "CalVer tag ${GITHUB_REF_NAME} accepted"

  # security-gates blocks the release until this tag's own security run
  # (security.yml also triggers on v* tags) completes green on THIS commit. A
  # release never ships from a ref the scanners never saw, nor on cached green
  # from an earlier branch run.
  security-gates:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: wait for the security workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The filesystem-scan gates from security.yml. The image scans there
          # (sca-trivy-image) run against a PR/main image; this release re-scans
          # the freshly pushed release image by digest in image-scan below, so
          # only the source-ref gates are required here.
          required="lexicon secrets-gitleaks secrets-trufflehog sast-semgrep sca-trivy-fs iac-policy vendored-integrity"
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            ok=true
            for job in $required; do
              status=$(echo "$runs" | jq -r --arg n "$job" '[.[] | select(.name==$n)] | last | .status // "absent"')
              concl=$(echo "$runs" | jq -r --arg n "$job" '[.[] | select(.name==$n)] | last | .conclusion // ""')
              if [ "$status" != "completed" ]; then
                ok=false
              elif [ "$concl" != "success" ] && [ "$concl" != "skipped" ]; then
                echo "::error::security gate '$job' concluded '$concl' on ${GITHUB_SHA}"
                exit 1
              fi
            done
            if [ "$ok" = true ]; then
              echo "all required security gates green on ${GITHUB_SHA}"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for the security gates on ${GITHUB_SHA}"
              exit 1
            fi
            sleep 20
          done

  # verify re-runs the test suite IN THIS RUN -- a release never ships on
  # cached green. The gateway is concurrency-bearing (forward hops + the MCP
  # listener), so the race detector runs over the whole suite.
  verify:
    runs-on: ubuntu-latest
    needs: [tag-format]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./... -timeout 600s
      - name: go test -race
        run: go test -race ./... -timeout 600s

  # ghcr-image builds and pushes the multi-arch distroless image BY DIGEST ONLY
  # -- no tag is attached here. NO VERSION build-arg is passed: the gateway has
  # no semver symbol (NFR-IC-04) and the Dockerfile takes only
  # TARGETOS/TARGETARCH. BuildKit's built-in sbom/provenance attestations are
  # DISABLED: they emit a different attestation format in a different location
  # (doubling the auditor's evidence paths) and default-provenance converts a
  # single-arch image into an OCI index, changing the digest we sign vs the
  # digest deploy pins. The SBOM and provenance are produced by the explicit
  # syft + attest steps below, matching the control/filestore fleet posture.
  #
  # Push BY DIGEST ONLY -- cosign signs by digest, so the push technically has
  # to happen before the signature can exist; the invariant that matters is
  # therefore not "sign before push" but "no reference a consumer would pull
  # exists before the signature". A digest nobody has been told is not such a
  # reference; a release tag is. The tag is attached later by the promote job,
  # which runs only after signing (mirrors ocu-control's release.yml).
  ghcr-image:
    runs-on: ubuntu-latest
    needs: [tag-format, security-gates, verify]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the OCI labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
      - name: build and push linux/amd64 + linux/arm64 (digest only)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # Disable BuildKit's built-in attestations: the explicit syft +
          # attest-build-provenance steps below are the fleet-consistent source,
          # and default-provenance would turn a single-arch push into an OCI
          # index, changing the signed digest. NO VERSION build-arg (NFR-IC-04).
          # No tags: only the digest reference exists until promote runs.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: false
          provenance: false

  # image-scan runs trivy over the JUST-pushed image by digest -- CRITICAL,HIGH
  # blocks, same floor as the filesystem scan. A release never ships from a run
  # whose container image carries an unscanned or CRITICAL/HIGH-vulnerable base.
  image-scan:
    runs-on: ubuntu-latest
    needs: [ghcr-image]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve the pushed image reference (registry paths are lowercase)
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.ghcr-image.outputs.digest }}" >> "$GITHUB_ENV"
      - name: trivy image -- CRITICAL,HIGH blocks
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"

  # sbom-and-sign generates an SPDX SBOM over the pushed image by digest, signs
  # the image with cosign keyless (OIDC, no stored key), and attests SLSA build
  # provenance -- all bound to the image DIGEST. Runs after image-scan so the
  # release never signs an unscanned image.
  sbom-and-sign:
    runs-on: ubuntu-latest
    needs: [ghcr-image, image-scan]
    permissions:
      contents: read
      packages: write
      # cosign keyless (OIDC token exchange) + attest-build-provenance
      # (Sigstore attestation write).
      id-token: write
      attestations: write
    steps:
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - name: install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the lowercase image name (OCI refs must be lowercase)
        run: echo "IMAGE_NAME_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # SPDX SBOM over the pushed image by digest (not a tag -- immutable ref).
      - name: generate the image SBOM (SPDX, by digest)
        run: |
          set -euo pipefail
          syft "${IMAGE_NAME_LC}@${{ needs.ghcr-image.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json
          test -s sbom.spdx.json || { echo "::error::empty SBOM"; exit 1; }

      # cosign keyless: sign the image by DIGEST (immutable). OIDC identity is
      # the GitHub Actions workflow; no long-lived key. Recorded in Rekor.
      - name: cosign keyless sign -- image by digest
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME_LC}@${{ needs.ghcr-image.outputs.digest }}"

      # Attach the SBOM to the image as a cosign attestation (predicate=spdxjson),
      # bound to the same digest and recorded in Rekor.
      - name: cosign attest -- SBOM to the image digest
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE_NAME_LC}@${{ needs.ghcr-image.outputs.digest }}"

      # SLSA build provenance over the image digest, pushed to the registry as
      # an OCI attestation. Consumer verify: gh attestation verify <image-ref>
      # --owner Wide-Moat.
      - name: attest build provenance (SLSA) -- image by digest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME_LC }}
          subject-digest: ${{ needs.ghcr-image.outputs.digest }}
          push-to-registry: true

      - name: upload the SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom.spdx.json
          retention-days: 7

  # promote attaches the human-usable tags to a digest that is ALREADY signed
  # and attested. Splitting this out of ghcr-image is what closes the
  # publish/sign window: until this job runs, the only way to reach the image
  # is a digest that has not been published under any tag, so there is no
  # reference a consumer could pull unsigned. Mirrors ocu-control's release.yml
  # promote job exactly (same imagetools-create-on-a-signed-digest pattern).
  #
  # docker buildx imagetools create on a MULTI-ARCH INDEX digest (which
  # ghcr-image's push-by-digest=true + name-canonical=true produces) preserves
  # the index -- the new tag resolves to the same index, so every platform
  # stays reachable under the tag. Tagging a single-platform manifest digest
  # instead would silently drop the other architecture even on a green run.
  promote:
    runs-on: ubuntu-latest
    needs: [tag-format, security-gates, verify, ghcr-image, image-scan, sbom-and-sign]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the image tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          # CalVer tag as the release image tag, plus the immutable commit sha.
          # No semver patterns: the gateway has no semver (NFR-IC-04).
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
      - name: tag the signed digest
        env:
          DIGEST: ${{ needs.ghcr-image.outputs.digest }}
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          # One imagetools create per tag, all pointing at the same signed
          # multi-arch index digest -- so a caller pulling by EITHER tag sees
          # the identical, already-signed image.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "tagging ${tag} -> ${name}@${DIGEST}"
            docker buildx imagetools create --tag "$tag" "${name}@${DIGEST}"
          done <<< "${{ steps.meta.outputs.tags }}"

  # release creates the GitHub Release on the tag with the verification runbook.
  # The image (with its signatures + attestations) is the artifact of record;
  # the release notes point consumers at it. No binaries are attached: the
  # gateway ships only as a distroless image.
  release:
    runs-on: ubuntu-latest
    needs: [tag-format, security-gates, verify, ghcr-image, image-scan, sbom-and-sign, promote]
    permissions:
      contents: write
    steps:
      - name: derive the lowercase image name
        run: echo "IMAGE_NAME_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: download the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
      - name: create the GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
          body: |
            ## Container image

            `${{ env.IMAGE_NAME_LC }}:${{ github.ref_name }}`
            pinned by digest `${{ needs.ghcr-image.outputs.digest }}`
            (linux/amd64 + linux/arm64).

            The gateway carries no semver by design (its compatibility contract
            is the negotiated MCP date string, NFR-IC-04); this release is named
            by build date, not protocol revision.

            ## Supply-chain verification

            The image is signed with cosign keyless (GitHub OIDC, no stored key)
            and its provenance is recorded in the public Rekor transparency log.
            The SBOM is attached both here and as a cosign attestation on the
            image; SLSA build provenance is attested via GitHub's Sigstore
            integration. Signatures and attestations bind to the image DIGEST.

            **Verify the image signature:**
            ```bash
            cosign verify \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.IMAGE_NAME_LC }}@${{ needs.ghcr-image.outputs.digest }}
            ```

            **Verify SLSA build provenance:**
            ```bash
            gh attestation verify \
              --owner ${{ github.repository_owner }} \
              oci://${{ env.IMAGE_NAME_LC }}@${{ needs.ghcr-image.outputs.digest }}
            ```
